---
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      - dependency-name: '@eslint/js'
        versions: ['>=10.0.0']
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    groups:
      react:
        patterns:
          - '@tailwindcss/vite'
          - '@types/react'
          - 'dayjs'
          - 'linkify-react'
          - 'linkifyjs'
          - 'react'
          - 'react-*'
          - 'tailwindcss'
      development:
        patterns:
          - '@testing-library/*'
          - '@types/*'
          - '@typescript-eslint/*'
          - '@vitejs/*'
          - '@vitest/*'
          - 'cssnano'
          - 'eslint'
          - 'eslint-*'
          - 'jsdom'
          - 'prettier'
          - 'prettier-plugin-tailwindcss'
          - 'typescript'
          - 'vite'
          - 'vitest'
          - 'vitest-*'
